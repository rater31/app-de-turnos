# Build y deploy de la SPA Vite a GitHub Pages.
# - `npm run build` = tsc --noEmit && vite build (outDir: out/) && scripts/postbuild.mjs
#   (postbuild copia out/index.html -> out/404.html para deep links).
# - El artifact se sube desde `out/` (configurado en vite.config.ts, base: /app-de-turnos/).
name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Configuramos el token con permisos para desplegar a GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy concurrente; no cancela un deploy en curso.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Vite incrusta las VITE_* en el bundle en tiempo de build: si faltan, la
      # app se publica sin conexión a Supabase (ver ConfigFaltante.tsx). Cortar
      # acá es preferible a publicar un sitio roto que se ve bien en el log.
      - name: Verificar configuración
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          faltan=""
          [ -n "$VITE_SUPABASE_URL" ] || faltan="$faltan VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || faltan="$faltan VITE_SUPABASE_ANON_KEY"
          if [ -n "$faltan" ]; then
            echo "::error::Faltan los secrets:$faltan"
            echo "Crealos en GitHub -> Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_SUPPORT_WHATSAPP: ${{ vars.VITE_SUPPORT_WHATSAPP }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5