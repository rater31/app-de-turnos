# Build y deploy de la SPA Vite a GitHub Pages.
# - `npm run build` = tsc --noEmit && vite build (outDir: out/) && scripts/postbuild.mjs
#   (postbuild copia out/index.html -> out/404.html para deep links).
# - El artifact se sube desde `out/` (configurado en vite.config.ts, base: /app-de-turnos/).
name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Configuramos el token con permisos para desplegar a GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy concurrente; no cancela un deploy en curso.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5