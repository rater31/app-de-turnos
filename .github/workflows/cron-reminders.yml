name: cron-reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar a /api/cron/reminders
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/cron.out -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL:?Falta la variable SITE_URL}/api/cron/reminders")
          echo "HTTP $code"
          cat /tmp/cron.out
          if [ "$code" != "200" ]; then exit 1; fi